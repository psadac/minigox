name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64]
        include:
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="minigox-$GOOS-$GOARCH$ext"
          ldflags="-s -w -X 'main.version=$VERSION' -X 'main.commit=$COMMIT' -X 'main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          go build -ldflags "$ldflags" -o "dist/$name" .
      - name: Verify version
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          bin="dist/minigox-$GOOS-$GOARCH$ext"
          # go version -m reads build info without executing the binary, so this
          # works for cross-compiled targets too.
          go version -m "$bin" | grep -F "main.version=$VERSION"
      - name: Upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
